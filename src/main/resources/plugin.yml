name: ViciontProtections
version: ${project.version}
main: com.viciont.viciontprotections.ViciontProtections
api-version: '1.21'
authors:
- CrissyjuanxD
website: https://github.com/CrissyjuanxD/ViciontProtections
description: Protecciones WorldGuard con nombres, API, SQL y diálogos.
depend:
- WorldGuard
- WorldEdit
softdepend:
- ViaVersion
commands:
  proteccion:
    description: Gestiona protecciones y abre su diálogo cuando la versión lo permite.
    aliases:
    - pr
    - protections
    - proteccionv
    - vp
    usage: /pr ayuda
  givepr:
    description: Comando compatible de ViciontProtections; consulta /pr ayuda.
  addnamepr:
    description: Comando compatible de ViciontProtections; consulta /pr ayuda.
  addmember:
    description: Comando compatible de ViciontProtections; consulta /pr ayuda.
  delmember:
    description: Comando compatible de ViciontProtections; consulta /pr ayuda.
  addowner:
    description: Comando compatible de ViciontProtections; consulta /pr ayuda.
  delowner:
    description: Comando compatible de ViciontProtections; consulta /pr ayuda.
  ownerlist:
    description: Comando compatible de ViciontProtections; consulta /pr ayuda.
  memberlist:
    description: Comando compatible de ViciontProtections; consulta /pr ayuda.
  prlist:
    description: Comando compatible de ViciontProtections; consulta /pr ayuda.
  newnamepr:
    description: Comando compatible de ViciontProtections; consulta /pr ayuda.
  modnamepr:
    description: Comando compatible de ViciontProtections; consulta /pr ayuda.
  modmember:
    description: Comando compatible de ViciontProtections; consulta /pr ayuda.
  modowner:
    description: Comando compatible de ViciontProtections; consulta /pr ayuda.
  removepr:
    description: Comando compatible de ViciontProtections; consulta /pr ayuda.
  vpreload:
    description: Comando compatible de ViciontProtections; consulta /pr ayuda.
permissions:
  viciontprotections.user.create:
    description: Permite la función create respetando el rol en cada protección.
    default: op
  viciontprotections.user.list:
    description: Permite la función list respetando el rol en cada protección.
    default: op
  viciontprotections.user.info:
    description: Permite la función info respetando el rol en cada protección.
    default: op
  viciontprotections.user.members:
    description: Permite la función members respetando el rol en cada protección.
    default: op
  viciontprotections.user.owners:
    description: Permite la función owners respetando el rol en cada protección.
    default: op
  viciontprotections.user.name:
    description: Permite la función name respetando el rol en cada protección.
    default: op
  viciontprotections.user.delete:
    description: Permite la función delete respetando el rol en cada protección.
    default: op
  viciontprotections.user.borders:
    description: Permite la función borders respetando el rol en cada protección.
    default: op
  viciontprotections.user.*:
    description: Conjunto de permisos de uso.
    default: op
    children:
      viciontprotections.user.create: true
      viciontprotections.user.list: true
      viciontprotections.user.info: true
      viciontprotections.user.members: true
      viciontprotections.user.owners: true
      viciontprotections.user.name: true
      viciontprotections.user.delete: true
      viciontprotections.user.borders: true
  viciontprotections.admin.manage:
    description: Permite la función manage respetando el rol en cada protección.
    default: op
  viciontprotections.admin.give:
    description: Permite la función give respetando el rol en cada protección.
    default: op
  viciontprotections.admin.selection:
    description: Permite la función selection respetando el rol en cada protección.
    default: op
  viciontprotections.admin.flags:
    description: Permite la función flags respetando el rol en cada protección.
    default: op
  viciontprotections.admin.transfer:
    description: Permite la función transfer respetando el rol en cada protección.
    default: op
  viciontprotections.admin.reload:
    description: Permite la función reload respetando el rol en cada protección.
    default: op
  viciontprotections.admin.list:
    description: Permite la función list respetando el rol en cada protección.
    default: op
  viciontprotections.admin.*:
    description: Conjunto de permisos de administración.
    default: op
    children:
      viciontprotections.admin.manage: true
      viciontprotections.admin.give: true
      viciontprotections.admin.selection: true
      viciontprotections.admin.flags: true
      viciontprotections.admin.transfer: true
      viciontprotections.admin.reload: true
      viciontprotections.admin.list: true
