# ۞ Mensajes de ViciontProtections
#
# Formatos admitidos:
#   &#RRGGBB                                   color hex
#   &l &o &n ...                               códigos clásicos
#   <gradient:#RRGGBB:#RRGGBB>texto</gradient>  degradado
#   {titulo} {texto} {suave} {dato} {acento} {error} {admin} {worldguard} {worldedit}
#                                              colores de la paleta (abajo)
# Deja un mensaje vacío ('') para desactivarlo. Aplica los cambios con /pr recargar.
#
# No cambies messages-version: cuando una actualización trae mensajes nuevos, el plugin guarda
# este archivo como messages-vN-anterior.yml y crea uno actualizado.
messages-version: 3

# Paleta usada por todos los mensajes, menús y diálogos.
colores:
  titulo: '#B07CFF'      # morado
  texto: '#E9DCFF'       # morado pastel
  suave: '#C4A6EE'       # lila para texto secundario
  dato: '#F5B3DA'        # rosa pastel para nombres y valores
  acento: '#F06AAE'      # rosa para resaltar
  error: '#FF8FB8'       # avisos y errores
  admin: '#C99BFF'       # etiqueta de administración
  worldguard: '#A58BFF'  # etiqueta de WorldGuard
  worldedit: '#FFA3D1'   # etiqueta de WorldEdit

prefijos:
  publico: '{titulo}۞ {suave}[<gradient:#C29BFF:#F5A8D6>Viciont Protections</gradient>{suave}] {texto}'
  admin: '{titulo}۞ {suave}[<gradient:#A970FF:#E07BC0>Viciont Protections</gradient>{suave}] {admin}Admin {suave}» {texto}'
  worldguard: '{titulo}۞ {suave}[<gradient:#9D7CFF:#C9A0FF>Viciont Protections</gradient>{suave}] {worldguard}WorldGuard {suave}» {texto}'
  worldedit: '{titulo}۞ {suave}[<gradient:#E58BD0:#FFB8DD>Viciont Protections</gradient>{suave}] {worldedit}WorldEdit {suave}» {texto}'

avisos:
  # %name% = protección, %owner% = creador
  entrada: '{texto}Haz entrado a la protección {dato}%name% {texto}de {acento}%owner%{texto}.'
  entrada-actionbar: '{titulo}۞ {texto}Haz entrado a la protección {dato}%name%'
  salida: '{suave}Has salido de la protección {dato}%name%{suave}.'
  salida-actionbar: ''
  creada: '{texto}Nueva protección creada: {dato}%name%{texto}. Cambia su nombre con {acento}/pr nombre <nombre>{texto}.'
  # Mensaje de WorldGuard al intentar construir o usar algo sin permiso.
  denegado: '{titulo}۞ {suave}[<gradient:#C29BFF:#F5A8D6>Viciont Protections</gradient>{suave}] {error}No tienes permiso para hacer eso en esta protección.'

errores:
  inesperado: 'No se pudo completar la operación. Consulta la consola.'

guia:
  - '{acento}1. {texto}Consigue un {dato}bloque protector {texto}en una tienda o con la administración.'
  - '{acento}2. {texto}Colócalo en terreno libre: su descripción indica el tamaño exacto que protege.'
  - '{acento}3. {texto}Ponle nombre con {dato}/pr nombre <nombre>{texto}.'
  - '{acento}4. {dato}/pr miembro añadir <jugador> {texto}deja construir y abrir cofres a tus amigos.'
  - '{acento}5. {dato}/pr propietario añadir <jugador> {texto}deja gestionar miembros. Solo el creador gestiona propietarios.'
  - '{acento}6. {dato}/pr limites {texto}muestra u oculta el borde; {dato}/pr lista {texto}muestra tus protecciones.'
  - '{acento}7. {texto}Rompe el bloque protector para recuperarlo, o usa {dato}/pr eliminar{texto}.'
  - '{suave}Desde 1.21.6, {dato}/proteccion {suave}abre un menú para hacerlo todo sin comandos.'
