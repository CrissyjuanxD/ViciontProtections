guide:
  - '&#D5A7FF1. &#E9CFFFConsigue un bloque protector en una tienda o con un administrador.'
  - '&#D5A7FF2. &#E9CFFFColócalo en terreno libre. Su descripción indica el tamaño exacto.'
  - '&#D5A7FF3. &#E9CFFFUsa /pr nombre <nombre> para personalizar tu protección.'
  - '&#D5A7FF4. &#E9CFFF/pr miembro añadir <jugador> permite construir y usar tus objetos.'
  - '&#D5A7FF5. &#E9CFFF/pr propietario añadir <jugador> permite administrar miembros. Solo el creador gestiona propietarios.'
  - '&#D5A7FF6. &#E9CFFF/pr limites muestra u oculta los bordes para ti; /pr lista muestra tus protecciones.'
  - '&#D5A7FF7. &#E9CFFFEl creador puede retirar el bloque. /pr eliminar pide confirmación y elimina la protección.'
  - '&#F1BBDDDesde 1.21.6, /proteccion abre los diálogos. En otras versiones puedes usar todos los comandos.'
