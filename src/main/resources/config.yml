config-version: 2
# SQLite por defecto. Para MySQL, crea la base y su usuario: el plugin crea sus tablas.
database:
  type: sqlite
  filename: protections.db
  table-prefix: vp_
  mysql:
    host: localhost
    port: 3306
    database: viciontprotections
    username: viciont
    password: ''
    ssl-mode: PREFERRED
protections:
  max-per-player: 20
  max-block-size: 4096
# Permisos de usuario (viciontprotections.user.*): colocar bloques protectores y gestionar tus protecciones,
# y de clanes (viciontprotections.clan.*): usar /clan y /cc y fundar clanes.
# false: cualquier jugador puede usarlos, sin plugin de permisos. true: solo los OP o quien tenga el
# permiso (por ejemplo con LuckPerms). Los de administración (viciontprotections.admin.*) siempre son de OP.
permissions:
  require-user-permissions: false
# Los diálogos requieren servidor y cliente 1.21.6 o posterior.
dialogs:
  enabled: true
# Pon aquí los enlaces de tus guías. Vacío = no mostrar el enlace.
guide:
  spigot: ''
  modrinth: ''
# Compatibilidad con los bloques entregados en 1.x y /givepr small|medium|large.
protection_types:
  small:
    size: 32
  medium:
    size: 64
  large:
    size: 128
